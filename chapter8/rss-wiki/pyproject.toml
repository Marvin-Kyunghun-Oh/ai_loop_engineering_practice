[project]
name = "rss-wiki"
version = "0.1.0"
description = "RSS 피드를 Claude CLI로 요약·분류해 주제별 위키로 정리하는 개인용 웹 도구"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rss_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
