[project]
name = "llmops-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marvin-oh", email = "france1988@naver.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "langfuse>=5.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[project.scripts]
llmops-lab = "llmops_lab:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: 실제 claude CLI를 호출하는 통합 테스트 (비용 발생)",
]
