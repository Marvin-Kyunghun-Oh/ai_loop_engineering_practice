claude:
  path: claude

models:
  planner: opus
  generator: sonnet
  evaluator: sonnet

limits:
  max_iterations: 3
  max_total_usd: 20
  max_agent_usd: 1
  max_turns: null
  agent_timeout_min: 30
  backlog_per_milestone: 2
  max_consecutive_errors: 2

commands:
  test: "npx vitest run"
  test_path: "npx vitest run {path}"
  build: "npx vue-tsc --noEmit"
  add_dependency: "npm install <패키지>로 설치하고 package.json에 반영한다"

permissions:
  generator_bash:
    - "Bash(npx vitest:*)"
    - "Bash(npx vue-tsc:*)"
    - "Bash(npm install:*)"
    - "Bash(npm run build:*)"
    - "Bash(git status:*)"
    - "Bash(git diff:*)"
  evaluator_bash:
    - "Bash(npx vitest:*)"
    - "Bash(npx vue-tsc:*)"